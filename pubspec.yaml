name: bnssa
description: Application d'entrainement au BNSSA.
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- LES ESSENTIELS ---
  # On utilise les chapeaux "^" pour prendre les dernières versions
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0

  # --- CEUX QUI DEMANDENT LE SDK 36 ---
  shared_preferences: ^2.3.2
  google_sign_in: ^7.2.0
  google_mobile_ads: ^8.0.0
  webview_flutter: ^4.8.0

  # --- LA RÉPARATION (Important) ---
  # Upgradé à v10 pour compatibilité avec riverpod_generator 4.x (freezed_annotation 3.x)
  purchases_flutter: ^10.0.1

  # --- LE RESTE ---
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  intl: ^0.20.2
  change_app_package_name: ^1.5.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png" # Vérifie que le nom du fichier est bon !
  min_sdk_android: 23
  remove_alpha_ios: true