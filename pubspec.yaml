name: bnssa
description: Application d'entrainement au BNSSA.
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- LES ESSENTIELS ---
  # On utilise les chapeaux "^" pour prendre les dernières versions
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # --- CEUX QUI DEMANDENT LE SDK 36 ---
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  google_mobile_ads: ^5.1.0
  webview_flutter: ^4.8.0

  # --- LA RÉPARATION (Important) ---
  # On passe à la v8 pour ne plus avoir l'erreur "Registrar"
  purchases_flutter: ^8.0.0

  # --- LE RESTE ---
  fl_chart: ^0.66.0
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  intl: ^0.20.2
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png" # Vérifie que le nom du fichier est bon !
  min_sdk_android: 23
  remove_alpha_ios: true